inputSet:
  pipeline:
    identifier: UFT_Run_Upload_GitHub_StepGroup
    variables:
      - name: registryName
        type: String
        value: uft-one
    stages:
      - stage:
          identifier: WinRM_Stage
          type: Deployment
          spec:
            environment:
              infrastructureDefinitions:
                - identifier: winrmdorinvm2infrastructure
            execution:
              steps:
                - stepGroup:
                    identifier: FT_RunAndUpload
                    template:
                      templateInputs:
                        steps:
                          - step:
                              identifier: Run_FTToolsLauncher
                              template:
                                templateInputs:
                                  identifier: Run_FTToolsLauncher
                                  type: ShellScript
                                  spec:
                                    executionTarget:
                                      connectorRef: Local_to_VM
                                    environmentVariables:
                                      - name: testPath
                                        type: String
                                        value: C:\UFTTests\QuickPass
                                      - name: timeout
                                        type: Number
                                        value: -1
                                      - name: cancelRunOnFailure
                                        type: String
                                        value: "no"
                                      - name: resultTestNameOnly
                                        type: String
                                        value: "yes"
                                      - name: resultUnifiedTestClassname
                                        type: String
                                        value: "yes"
                                      - name: failIfNotPassed
                                        type: String
                                        value: "yes"
                                      - name: generateJUnitReport
                                        type: String
                                        value: "yes"
                                      - name: deletePreviousTestReports
                                        type: String
                                        value: "yes"
                          - step:
                              identifier: Upload_Files
                              template:
                                templateInputs:
                                  identifier: Upload_Files
                                  type: ShellScript
                                  spec:
                                    executionTarget:
                                      connectorRef: Local_to_VM
                                    environmentVariables:
                                      - name: ApiKey
                                        type: Secret
                                        value: account.uft_api_key
                                      - name: cleanupTestRunFiles
                                        type: String
                                        value: "yes"
  name: quick-pass
  identifier: quickpass
  orgIdentifier: default
  projectIdentifier: UFT
