inputSet:
  pipeline:
    identifier: FT_Run_And_Upload
    stages:
      - stage:
          identifier: Run_Functional_Tests
          type: Deployment
          spec:
            execution:
              steps:
                - stepGroup:
                    identifier: FT_Run_And_Upload
                    template:
                      templateInputs:
                        steps:
                          - step:
                              identifier: Run_FTToolsLauncher
                              type: ShellScript
                              spec:
                                executionTarget:
                                  connectorRef: Local_to_VM
                                environmentVariables:
                                  - name: testPath
                                    type: String
                                    value: C:\UFTTests\Quicks
                                  - name: timeout
                                    type: Number
                                    value: -1
                                  - name: cancelRunOnFailure
                                    type: String
                                    value: "no"
                                  - name: resultTestNameOnly
                                    type: String
                                    value: "yes"
                                  - name: resultUnifiedTestClassname
                                    type: String
                                    value: "no"
                                  - name: failIfNotPassed
                                    type: String
                                    value: "yes"
                                  - name: generateJUnitReport
                                    type: String
                                    value: "yes"
                                  - name: deletePreviousTestReports
                                    type: String
                                    value: "yes"
                          - step:
                              identifier: Upload_Files
                              type: ShellScript
                              spec:
                                executionTarget:
                                  connectorRef: Local_to_VM
                                environmentVariables:
                                  - name: RegistryName
                                    type: String
                                    value: uft-one
                                  - name: ApiKey
                                    type: Secret
                                    value: account.uft_api_key
                                  - name: cleanupTestRunFiles
                                    type: String
                                    value: "yes"
  name: quicks
  identifier: quicks
  orgIdentifier: default
  projectIdentifier: UFT
