inputSet:
  pipeline:
    identifier: UFT_Run_Upload
    stages:
      - stage:
          identifier: WinRM_Stage
          type: Deployment
          spec:
            service:
              serviceRef: ftservice
            environment:
              environmentRef: ftwindows
              infrastructureDefinitions:
                - identifier: winrmdorinvm2infrastructure
            execution:
              steps:
                - step:
                    identifier: Run_FTToolsLauncher
                    template:
                      templateInputs:
                        identifier: Run_FTToolsLauncher
                        type: ShellScript
                        spec:
                          executionTarget:
                            connectorRef: Local_to_VM
                          environmentVariables:
                            - name: testPath
                              type: String
                              value: C:\UFTTests\Calc
                            - name: timeout
                              type: Number
                              value: -1
                            - name: cancelRunOnFailure
                              type: String
                              value: "no"
                            - name: resultTestNameOnly
                              type: String
                              value: "yes"
                            - name: resultUnifiedTestClassname
                              type: String
                              value: "yes"
                            - name: failIfNotPassed
                              type: String
                              value: "yes"
                            - name: generateJUnitReport
                              type: String
                              value: "yes"
                            - name: deletePreviousTestReports
                              type: String
                              value: "yes"
                - step:
                    identifier: Upload_Files
                    template:
                      templateInputs:
                        identifier: Upload_Files
                        type: ShellScript
                        spec:
                          executionTarget:
                            connectorRef: Local_to_VM
                          environmentVariables:
                            - name: RegistryName
                              type: String
                              value: uft-one
                            - name: ApiKey
                              type: Secret
                              value: account.uft_api_key
                            - name: cleanupTestRunFiles
                              type: String
                              value: "yes"
  name: calculator
  identifier: calculator
  orgIdentifier: default
  projectIdentifier: UFT
