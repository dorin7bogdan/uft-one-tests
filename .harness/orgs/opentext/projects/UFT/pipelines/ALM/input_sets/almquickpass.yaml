inputSet:
  name: alm-quick-pass
  tags: {}
  identifier: almquickpass
  orgIdentifier: opentext
  projectIdentifier: UFT
  pipeline:
    identifier: ALM_RunAndUpload_Inline
    stages:
      - stage:
          identifier: WinRM
          type: Deployment
          spec:
            execution:
              steps:
                - stepGroup:
                    identifier: ALM
                    template:
                      templateInputs:
                        steps:
                          - step:
                              identifier: Run_FTToolsLauncher
                              type: ShellScript
                              spec:
                                executionTarget:
                                  connectorRef: DorinVM2
                                environmentVariables:
                                  - name: testSets
                                    type: String
                                    value: Jenkins\QuickPass
                                  - name: serverUrl
                                    type: String
                                    value: http://almrhel705.aws.swinfra.net:8080/qcbin
                                  - name: ssoEnabled
                                    type: String
                                    value: "no"
                                  - name: username
                                    type: String
                                    value: apikey-fpkrfsimkhrnqnoiqoio
                                  - name: password
                                    type: Secret
                                    value: apikey-fpkrfsimkhrnqnoiqoio
                                  - name: clientId
                                    type: String
                                    value: empty
                                  - name: apiKeySecret
                                    type: Secret
                                    value: empty
                                  - name: domain
                                    type: String
                                    value: AUTOMATION
                                  - name: project
                                    type: String
                                    value: CI_INTEGRATION
                                  - name: timeout
                                    type: Number
                                    value: "-1"
                                  - name: testSetsOrderByCriteria
                                    type: String
                                    value: name
                                  - name: runMode
                                    type: String
                                    value: LOCAL
                                  - name: runHost
                                    type: String
                                    value: localhost
                                  - name: generateJUnitReport
                                    type: String
                                    value: "no"
                                  - name: failIfNotPassed
                                    type: String
                                    value: "yes"
                          - step:
                              identifier: Upload_Files
                              type: ShellScript
                              spec:
                                executionTarget:
                                  connectorRef: DorinVM2
                                environmentVariables:
                                  - name: RegistryName
                                    type: String
                                    value: functional-testing
                                  - name: ApiKey
                                    type: Secret
                                    value: account.uft_api_key
                                  - name: cleanupTestRunFiles
                                    type: String
                                    value: "no"
