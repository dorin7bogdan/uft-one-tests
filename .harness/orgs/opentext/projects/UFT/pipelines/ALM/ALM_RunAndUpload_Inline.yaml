pipeline:
  name: ALM_RunAndUpload_Inline
  identifier: ALM_RunAndUpload_Inline
  description: Runs ALM tests with FTToolsLauncher on a WinRM host and uploads the run files to an Artifact Registry.
  projectIdentifier: UFT
  orgIdentifier: opentext
  tags: {}
  stages:
    - stage:
        name: WinRM
        identifier: WinRM
        description: ""
        type: Deployment
        spec:
          deploymentType: WinRm
          service:
            serviceRef: ftservice
          environment:
            environmentRef: ftwindows
            deployToAll: false
            infrastructureDefinitions:
              - identifier: dorinvm2infra
          execution:
            steps:
              - stepGroup:
                  name: ALM
                  identifier: ALM
                  template:
                    templateRef: ALM_RunAndUpload_inline
                    versionLabel: "27.1"
                    templateInputs:
                      steps:
                        - step:
                            identifier: Run_FTToolsLauncher
                            type: ShellScript
                            spec:
                              executionTarget:
                                connectorRef: <+input>
                              environmentVariables:
                                - name: testSets
                                  type: String
                                  value: <+input>
                                - name: serverUrl
                                  type: String
                                  value: <+input>
                                - name: ssoEnabled
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: username
                                  type: String
                                  value: <+input>.default(empty)
                                - name: password
                                  type: Secret
                                  value: <+input>.default(empty)
                                - name: clientId
                                  type: String
                                  value: <+input>.default(empty)
                                - name: apiKeySecret
                                  type: Secret
                                  value: <+input>.default(empty)
                                - name: domain
                                  type: String
                                  value: <+input>
                                - name: project
                                  type: String
                                  value: <+input>
                                - name: timeout
                                  type: Number
                                  value: <+input>.default(-1)
                                - name: testSetsOrderByCriteria
                                  type: String
                                  value: <+input>.default(name).allowedValues(id,name)
                                - name: runMode
                                  type: String
                                  value: <+input>.default(LOCAL).allowedValues(LOCAL,REMOTE,PLANNED_HOST)
                                - name: runHost
                                  type: String
                                  value: <+input>.default(localhost)
                                - name: generateJUnitReport
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: failIfNotPassed
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
                        - step:
                            identifier: Upload_Files
                            type: ShellScript
                            spec:
                              executionTarget:
                                connectorRef: <+input>
                              environmentVariables:
                                - name: RegistryName
                                  type: String
                                  value: <+input>
                                - name: ApiKey
                                  type: Secret
                                  value: <+input>
                                - name: cleanupTestRunFiles
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
