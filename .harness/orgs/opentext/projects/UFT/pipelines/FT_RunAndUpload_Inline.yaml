pipeline:
  name: FT_RunAndUpload_Inline
  identifier: FT_RunAndUpload_Inline
  description: Runs UFT file system tests with the FT_FileSystem_RunAndUpload_inline step group template and uploads the run files to an Artifact Registry.
  projectIdentifier: UFT
  orgIdentifier: opentext
  tags:
    ai_generated: ""
  stages:
    - stage:
        name: FT Run And Upload Inline
        identifier: FT_Run_And_Upload_Inline
        description: ""
        type: Deployment
        spec:
          deploymentType: WinRm
          service:
            serviceRef: ftservice
          environment:
            environmentRef: ftwindows
            deployToAll: false
            infrastructureDefinitions:
              - identifier: dorinvm2infra
          execution:
            steps:
              - stepGroup:
                  name: FT Run And Upload Inline
                  identifier: FT_Run_And_Upload_Inline
                  template:
                    templateRef: FT_FileSystem_RunAndUpload_inline
                    versionLabel: "27.1"
                    templateInputs:
                      steps:
                        - step:
                            identifier: Run_FTToolsLauncher
                            type: ShellScript
                            spec:
                              executionTarget:
                                connectorRef: <+input>
                              environmentVariables:
                                - name: testPath
                                  type: String
                                  value: <+input>
                                - name: timeout
                                  type: Number
                                  value: <+input>.default(-1)
                                - name: cancelRunOnFailure
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: resultTestNameOnly
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
                                - name: resultUnifiedTestClassname
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: failIfNotPassed
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
                                - name: generateJUnitReport
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: deletePreviousTestReports
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
                        - step:
                            identifier: Upload_Files
                            type: ShellScript
                            spec:
                              executionTarget:
                                connectorRef: <+input>
                              environmentVariables:
                                - name: RegistryName
                                  type: String
                                  value: <+input>
                                - name: ApiKey
                                  type: Secret
                                  value: <+input>
                                - name: cleanupTestRunFiles
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
