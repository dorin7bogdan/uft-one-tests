template:
  name: FT_FileSystem_RunAndUpload_inline
  identifier: FT_FileSystem_RunAndUpload_inline
  versionLabel: "27.1"
  type: StepGroup
  description: Step group with both steps defined inline as ShellScript steps over WinRM. Runs FTToolsLauncher with runType=FileSystem, fsZipTestReports=true, fsDeletePreviousTestReports (yes/no from input) and generateJUnitReport (yes/no from input) in FT_TOOLS_LAUNCHER\<pipeline identifier>\<sequenceId> (printing the launcher command first, integer timeout in props), fails the step on a non-zero exit code when failIfNotPassed is yes, then uploads all files from that run folder (props, results, reports) to an Artifact Registry under a per-pipeline package, even if the run fails. The Artifact Registry API key is a Secret-type input. The upload step deletes the run folder when cleanupTestRunFiles is yes and all uploads succeed; with no, the run folder stays on the VM.
  projectIdentifier: UFT
  orgIdentifier: opentext
  tags:
    functional_testing: ""
  spec:
    stageType: CD
    steps:
      - step:
          name: Run FTToolsLauncher
          identifier: Run_FTToolsLauncher
          type: ShellScript
          timeout: 10m
          spec:
            shell: PowerShell
            onDelegate: false
            executionTarget:
              host: <+repeat.item>
              connectorRef: <+input>
            source:
              type: Inline
              spec:
                script: |-
                  $ErrorActionPreference = 'Stop'
                  $tools = "$Env:FT_TOOLS_LAUNCHER"
                  if (-not $tools) { Write-Host "FT_TOOLS_LAUNCHER is not defined on this VM"; exit 1 }
                  if (Test-Path -LiteralPath $tools -PathType Leaf) {
                    $exe = $tools
                    $dir = Split-Path -Parent $tools
                  } else {
                    $dir = $tools
                    $exe = Get-ChildItem -Path $dir -Filter 'FTToolsLauncher*.exe' | Select-Object -First 1 -ExpandProperty FullName
                  }
                  if (-not $exe) { Write-Host "FTToolsLauncher not found in $tools"; exit 1 }
                  $work = Join-Path (Join-Path $dir "<+pipeline.identifier>") "<+pipeline.sequenceId>"
                  New-Item -ItemType Directory -Force -Path $work | Out-Null
                  Set-Location $work
                  Write-Host "Work dir: $PWD"
                  $f = "props.txt"
                  $tp = "$Env:testPath" -replace '\\+', '\\'
                  $to = [int][math]::Truncate([double]::Parse("$Env:timeout", [Globalization.CultureInfo]::InvariantCulture))
                  $lines = @(
                    "runType=FileSystem",
                    "Test1=$tp",
                    "resultsFilename=results.xml",
                    "fsTimeout=$to",
                    "cancelRunOnFailure=$Env:cancelRunOnFailure",
                    "resultTestNameOnly=$Env:resultTestNameOnly",
                    "resultUnifiedTestClassname=$Env:resultUnifiedTestClassname",
                    "fsZipTestReports=true",
                    "fsDeletePreviousTestReports=$Env:deletePreviousTestReports",
                    "generateJUnitReport=$Env:generateJUnitReport"
                  )
                  [IO.File]::WriteAllLines("$PWD\$f", $lines)
                  Write-Host "$exe -paramfile $f"
                  $p = Start-Process $exe -ArgumentList "-paramfile", $f -Wait -PassThru -NoNewWindow
                  Write-Host "FTToolsLauncher exit code: $($p.ExitCode)"
                  if ($p.ExitCode -ne 0 -and "$Env:failIfNotPassed" -eq 'yes') { exit $p.ExitCode }
                  exit 0
            environmentVariables:
              - name: testPath
                type: String
                description: Path of the test or test folder to run on the VM.
                value: <+input>
              - name: timeout
                type: Number
                description: Maximum run time in seconds (-1 for no limit).
                value: <+input>.default(-1)
              - name: cancelRunOnFailure
                type: String
                description: Stop the run after the first failed test (yes/no).
                value: <+input>.default(no).allowedValues(yes,no)
              - name: resultTestNameOnly
                type: String
                description: Show only the test name, not its full path, in the results (yes/no).
                value: <+input>.default(yes).allowedValues(yes,no)
              - name: resultUnifiedTestClassname
                type: String
                description: Use one unified class name for all tests in the results (yes/no).
                value: <+input>.default(no).allowedValues(yes,no)
              - name: failIfNotPassed
                type: String
                description: Fail the step when FTToolsLauncher returns a non-zero exit code (yes/no).
                value: <+input>.default(yes).allowedValues(yes,no)
              - name: generateJUnitReport
                type: String
                description: Also generate a JUnit XML report (yes/no).
                value: <+input>.default(no).allowedValues(yes,no)
              - name: deletePreviousTestReports
                type: String
                description: Delete previous test reports before the run (yes/no).
                value: <+input>.default(yes).allowedValues(yes,no)
            outputVariables: []
            delegateSelectors:
              - uft
          failureStrategies:
            - onFailure:
                errors:
                  - AllErrors
                action:
                  type: MarkAsFailure
          strategy:
            repeat:
              items: <+infra.hosts>
      - step:
          name: Upload Files
          identifier: Upload_Files
          type: ShellScript
          timeout: 10m
          when:
            stageStatus: All
          spec:
            shell: PowerShell
            onDelegate: false
            executionTarget:
              host: <+repeat.item>
              connectorRef: <+input>
            source:
              type: Inline
              spec:
                script: |
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Add-Type -AssemblyName System.Net.Http
                  $tools = "$env:FT_TOOLS_LAUNCHER"
                  if (-not $tools) { Write-Host "FT_TOOLS_LAUNCHER is not defined on this VM"; exit 1 }
                  if (Test-Path -LiteralPath $tools -PathType Leaf) { $tools = Split-Path -Parent $tools }
                  $pkg = "<+pipeline.identifier>"
                  $seqId = "<+pipeline.sequenceId>"
                  $work = Join-Path (Join-Path $tools $pkg) $seqId
                  New-Item -ItemType Directory -Force -Path $work | Out-Null
                  Set-Location $work
                  Write-Host "Work dir: $PWD"
                  $registry = "$env:RegistryName".Trim()
                  $key = "$env:ApiKey".Trim()
                  if ($registry -eq '') { Write-Host "No registry name provided"; exit 1 }
                  if ($key -eq '') { Write-Host "No API key provided"; exit 1 }
                  $names = @(Get-ChildItem -LiteralPath $PWD.Path -File | Select-Object -ExpandProperty Name)
                  $uri = "https://pkg.harness.io/pkg/<+account.identifier>/$registry/generic/$pkg/run-$seqId"
                  $link = "https://app.harness.io/ng/account/<+account.identifier>/module/har/orgs/<+org.identifier>/projects/<+project.identifier>/registries/$registry/artifacts/$pkg/versions/run-$seqId/overview"
                  $failed = $false
                  $client = $null
                  try {
                    $client = New-Object System.Net.Http.HttpClient
                    $client.DefaultRequestHeaders.Add("x-api-key", $key)
                    foreach ($f in $names) {
                      $path = Join-Path $PWD.Path $f
                      if (-not (Test-Path -LiteralPath $path)) {
                        Write-Host "Skipping $path (not found)"
                        continue
                      }
                      Write-Host "Uploading $path"
                      $stream = $null
                      $content = $null
                      $resp = $null
                      try {
                        # Stream the file from disk instead of loading it into memory.
                        $stream = [System.IO.File]::OpenRead($path)
                        $content = New-Object System.Net.Http.MultipartFormDataContent
                        $content.Add((New-Object System.Net.Http.StringContent($f)), 'filename')
                        $content.Add((New-Object System.Net.Http.StreamContent($stream)), 'file', $f)
                        $resp = $client.PutAsync($uri, $content).Result
                        Write-Host "HTTP $([int]$resp.StatusCode) $($resp.Content.ReadAsStringAsync().Result)"
                        if (-not $resp.IsSuccessStatusCode) { $failed = $true }
                      }
                      catch {
                        Write-Host "Upload failed for ${f}: $($_.Exception.GetBaseException().Message)"
                        $failed = $true
                      }
                      finally {
                        if ($null -ne $resp) { $resp.Dispose() }
                        if ($null -ne $content) { $content.Dispose() }
                        if ($null -ne $stream) { $stream.Dispose() }
                      }
                    }
                  }
                  finally {
                    if ($null -ne $client) { $client.Dispose() }
                  }
                  Write-Host ""
                  Write-Host "Uploaded files: $link"
                  if ($failed) { exit 1 }
                  if ("$env:cleanupTestRunFiles" -eq 'yes') {
                    Set-Location $tools
                    Remove-Item -LiteralPath $work -Recurse -Force
                    Write-Host "Deleted run folder: $work"
                  } else {
                    Write-Host "Run folder kept: $work"
                  }
            environmentVariables:
              - name: RegistryName
                type: String
                description: Name of the Harness Artifact Registry to upload the run files to.
                value: <+input>
              - name: ApiKey
                type: Secret
                description: Secret holding the Harness API key used to upload to the registry.
                value: <+input>
              - name: cleanupTestRunFiles
                type: String
                description: Delete the run folder on the VM after all uploads succeed (yes/no).
                value: <+input>.default(yes).allowedValues(yes,no)
            outputVariables: []
            delegateSelectors:
              - uft
          strategy:
            repeat:
              items: <+infra.hosts>
