template:
  name: ALM_Run
  identifier: ALM_Run
  versionLabel: "27.1"
  type: Step
  description: WinRM ShellScript step that runs FTToolsLauncher with runType=Alm using the ALM connection and test set inputs (saved in props.txt) in FT_TOOLS_LAUNCHER\<pipeline identifier>\<sequenceId>. The ALM password and API key secret are encrypted with FTL-Helper.ps1 (loaded from the same folder as FTToolsLauncher on the VM) and the key is passed to FTToolsLauncher with --use-stdin-key. Fails the step on a non-zero exit code when failIfNotPassed is yes.
  projectIdentifier: UFT
  orgIdentifier: opentext
  tags:
    functional_testing: ""
  spec:
    name: Run FTToolsLauncher
    identifier: Run_FTToolsLauncher
    timeout: 10m
    type: ShellScript
    spec:
      shell: PowerShell
      onDelegate: false
      executionTarget:
        host: <+repeat.item>
        connectorRef: <+input>
      source:
        type: Inline
        spec:
          script: |-
            $ErrorActionPreference = 'Stop'

            $pwdChars = New-Object char[] 0
            $secretChars = New-Object char[] 0
            $exitCode = 1
            $setupFailed = $false

            try {
              # Only the secret for the selected auth mode is read; the other one stays empty.
              # Both are removed from the environment immediately.
              if ("$Env:ssoEnabled" -eq 'yes') {
                $secretChars = "$Env:apiKeySecret".ToCharArray()
              } else {
                $pwdChars = "$Env:password".ToCharArray()
              }
              Remove-Item Env:password -ErrorAction SilentlyContinue
              Remove-Item Env:apiKeySecret -ErrorAction SilentlyContinue

              $tools = "$Env:FT_TOOLS_LAUNCHER"
              if (-not $tools) { throw "FT_TOOLS_LAUNCHER is not defined on this VM" }
              if (Test-Path -LiteralPath $tools -PathType Leaf) {
                $exe = $tools
                $dir = Split-Path -Parent $tools
              } else {
                $dir = $tools
                $exe = Get-ChildItem -Path $dir -Filter 'FTToolsLauncher*.exe' | Select-Object -First 1 -ExpandProperty FullName
              }
              if (-not $exe) { throw "FTToolsLauncher not found in $tools" }
              $helperPath = Join-Path (Split-Path -Parent $exe) 'FTL-Helper.ps1'
              if (-not (Test-Path -LiteralPath $helperPath -PathType Leaf)) { throw "FTL-Helper.ps1 not found at $helperPath" }
              $work = Join-Path (Join-Path $dir "<+pipeline.identifier>") "<+pipeline.sequenceId>"
              New-Item -ItemType Directory -Force -Path $work | Out-Null
              Set-Location $work
              Write-Host "Work dir: $PWD"

              . $helperPath
              if (-not (Get-Command 'Invoke-FTL' -ErrorAction SilentlyContinue)) { throw "FTL-Helper.ps1 at $helperPath is outdated: Invoke-FTL not found" }

              $serverUrlEsc = "$Env:serverUrl".Replace(':', '\:')
              $lines = @(
                "runType=Alm",
                "almServerUrl=$serverUrlEsc",
                "almSSOEnabled=$Env:ssoEnabled",
                "almUsername=$Env:username",
                "almClientId=$Env:clientId",
                "almDomain=$Env:domain",
                "almProject=$Env:project",
                "almTimeout=$Env:timeout",
                "almTestSetsOrderByCriteria=$Env:testSetsOrderByCriteria",
                "almRunMode=RUN_$Env:runMode",
                "almRunHost=$Env:runHost",
                "generateJUnitReport=$Env:generateJUnitReport",
                "resultsFilename=results.xml"
              )
              $sets = @("$Env:testSets" -split '[,;]' | ForEach-Object { $_.Trim().Trim('"') } | Where-Object { $_ -ne '' })
              $i = 1
              foreach ($s in $sets) {
                $lines += "TestSet$i=" + ("$s" -replace '[\\/]+', '\\')
                $i++
              }

              $secrets = @{
                almPassword     = $pwdChars
                almApiKeySecret = $secretChars
              }

              # The key is generated, used and cleared inside the helper; it never reaches this script.
              $exitCode = Invoke-FTL -ExePath $exe -WorkingDirectory $PWD.Path -Lines $lines -Secrets $secrets
              Write-Host "FTToolsLauncher exit code: $exitCode"
            }
            catch {
              Write-Host "ERROR: $($_.Exception.Message)"
              $setupFailed = $true
            }
            finally {
              # Safety net: always runs, including on errors and early failures.
              if ($null -ne $pwdChars) { [Array]::Clear($pwdChars, 0, $pwdChars.Length) }
              if ($null -ne $secretChars) { [Array]::Clear($secretChars, 0, $secretChars.Length) }
            }

            if ($setupFailed) { exit 1 }
            if ($exitCode -ne 0 -and "$Env:failIfNotPassed" -eq 'yes') { exit $exitCode }
            exit 0
      environmentVariables:
        - name: testSets
          type: String
          description: ALM test sets to run, separated by comma or semicolon (for example Root\Folder\TestSet1).
          value: <+input>
        - name: serverUrl
          type: String
          description: "URL of the ALM server (pattern: http(s)://<server>:<port>)."
          value: <+input>
        - name: ssoEnabled
          type: String
          description: Authenticate with an API key (SSO) instead of username and password (yes/no).
          value: <+input>.default(no).allowedValues(yes,no)
        - name: username
          type: String
          description: ALM username (used when SSO is no).
          value: <+input>.default(none)
        - name: password
          type: Secret
          description: Secret holding the ALM password (used when SSO is no).
          value: <+input>.default(none)
        - name: clientId
          type: String
          description: ALM API key client ID (used when SSO is yes).
          value: <+input>.default(none)
        - name: apiKeySecret
          type: Secret
          description: Secret holding the ALM API key secret (used when SSO is yes).
          value: <+input>.default(none)
        - name: domain
          type: String
          description: ALM domain that contains the test sets.
          value: <+input>
        - name: project
          type: String
          description: ALM project that contains the test sets.
          value: <+input>
        - name: timeout
          type: Number
          description: Maximum run time in seconds (-1 for no limit).
          value: <+input>.default(-1)
        - name: testSetsOrderByCriteria
          type: String
          description: Order in which the test sets are run, by id or by name.
          value: <+input>.default(name).allowedValues(id,name)
        - name: runMode
          type: String
          description: Where the tests run - LOCAL, REMOTE or PLANNED_HOST.
          value: <+input>.default(LOCAL).allowedValues(LOCAL,REMOTE,PLANNED_HOST)
        - name: runHost
          type: String
          description: Host that runs the tests when the run mode is REMOTE.
          value: <+input>.default(localhost)
        - name: generateJUnitReport
          type: String
          description: Also generate a JUnit XML report (yes/no).
          value: <+input>.default(no).allowedValues(yes,no)
        - name: failIfNotPassed
          type: String
          description: Fail the step when FTToolsLauncher returns a non-zero exit code (yes/no).
          value: <+input>.default(yes).allowedValues(yes,no)
      outputVariables: []
      delegateSelectors:
        - uft
    failureStrategies:
      - onFailure:
          errors:
            - AllErrors
          action:
            type: MarkAsFailure
    strategy:
      repeat:
        items: <+infra.hosts>
