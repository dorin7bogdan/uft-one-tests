template:
  name: ALM_RunAndUpload_inline
  identifier: ALM_RunAndUpload_inline
  versionLabel: "27.1"
  type: StepGroup
  description: Step group with both steps defined inline as ShellScript steps over WinRM. Runs FTToolsLauncher with runType=Alm using the ALM connection and test set inputs (saved in props.txt) in FT_TOOLS_LAUNCHER\<pipeline identifier>\<sequenceId>. The ALM password and API key secret are encrypted with Protect-Data.ps1 (loaded from the same folder as FTToolsLauncher on the VM) and the key is passed to FTToolsLauncher with --use-stdin-key. Fails the step on a non-zero exit code when failIfNotPassed is yes, then uploads all files from that run folder (including props.txt) to an Artifact Registry under a per-pipeline package, even if the run fails. The upload step deletes the run folder, including props.txt, when cleanupTestRunFiles is yes and all uploads succeed; with no, the run folder, including props.txt, stays on the VM.
  projectIdentifier: UFT
  orgIdentifier: opentext
  tags:
    functional_testing: ""
  spec:
    stageType: CD
    steps:
      - step:
          name: Run FTToolsLauncher
          identifier: Run_FTToolsLauncher
          type: ShellScript
          timeout: 10m
          spec:
            shell: PowerShell
            onDelegate: false
            executionTarget:
              host: <+repeat.item>
              connectorRef: <+input>
            source:
              type: Inline
              spec:
                script: |-
                  $ErrorActionPreference = 'Stop'

                  $pwdChars = New-Object char[] 0
                  $secretChars = New-Object char[] 0
                  $exitCode = 1
                  $setupFailed = $false

                  try {
                    # Only the secret for the selected auth mode is read; the other one stays empty.
                    # Both are removed from the environment immediately.
                    if ("$Env:ssoEnabled" -eq 'yes') {
                      $secretChars = "$Env:apiKeySecret".ToCharArray()
                    } else {
                      $pwdChars = "$Env:password".ToCharArray()
                    }
                    Remove-Item Env:password -ErrorAction SilentlyContinue
                    Remove-Item Env:apiKeySecret -ErrorAction SilentlyContinue

                    $tools = "$Env:FT_TOOLS_LAUNCHER"
                    if (-not $tools) { throw "FT_TOOLS_LAUNCHER is not defined on this VM" }
                    if (Test-Path -LiteralPath $tools -PathType Leaf) {
                      $exe = $tools
                      $dir = Split-Path -Parent $tools
                    } else {
                      $dir = $tools
                      $exe = Get-ChildItem -Path $dir -Filter 'FTToolsLauncher*.exe' | Select-Object -First 1 -ExpandProperty FullName
                    }
                    if (-not $exe) { throw "FTToolsLauncher not found in $tools" }
                    $helperPath = Join-Path (Split-Path -Parent $exe) 'Protect-Data.ps1'
                    if (-not (Test-Path -LiteralPath $helperPath -PathType Leaf)) { throw "Protect-Data.ps1 not found at $helperPath" }
                    $work = Join-Path (Join-Path $dir "<+pipeline.identifier>") "<+pipeline.sequenceId>"
                    New-Item -ItemType Directory -Force -Path $work | Out-Null
                    Set-Location $work
                    Write-Host "Work dir: $PWD"

                    . $helperPath
                    if (-not (Get-Command 'Invoke-FTL' -ErrorAction SilentlyContinue)) { throw "Protect-Data.ps1 at $helperPath is outdated: Invoke-FTL not found" }

                    $serverUrlEsc = "$Env:serverUrl".Replace(':', '\:')
                    $lines = @(
                      "runType=Alm",
                      "almServerUrl=$serverUrlEsc",
                      "almSSOEnabled=$Env:ssoEnabled",
                      "almUsername=$Env:username",
                      "almClientId=$Env:clientId",
                      "almDomain=$Env:domain",
                      "almProject=$Env:project",
                      "almTimeout=$Env:timeout",
                      "almTestSetsOrderByCriteria=$Env:testSetsOrderByCriteria",
                      "almRunMode=RUN_$Env:runMode",
                      "almRunHost=$Env:runHost",
                      "generateJUnitReport=$Env:generateJUnitReport",
                      "resultsFilename=results.xml"
                    )
                    $sets = @("$Env:testSets" -split '[,;]' | ForEach-Object { $_.Trim().Trim('"') } | Where-Object { $_ -ne '' })
                    $i = 1
                    foreach ($s in $sets) {
                      $lines += "TestSet$i=" + ("$s" -replace '[\\/]+', '\\')
                      $i++
                    }

                    $secrets = @{
                      almPassword     = $pwdChars
                      almApiKeySecret = $secretChars
                    }

                    # The key is generated, used and cleared inside the helper; it never reaches this script.
                    $exitCode = Invoke-FTL -ExePath $exe -WorkingDirectory $PWD.Path -Lines $lines -Secrets $secrets
                    Write-Host "FTToolsLauncher exit code: $exitCode"
                  }
                  catch {
                    Write-Host "ERROR: $($_.Exception.Message)"
                    $setupFailed = $true
                  }
                  finally {
                    # Safety net: always runs, including on errors and early failures.
                    if ($null -ne $pwdChars) { [Array]::Clear($pwdChars, 0, $pwdChars.Length) }
                    if ($null -ne $secretChars) { [Array]::Clear($secretChars, 0, $secretChars.Length) }
                  }

                  if ($setupFailed) { exit 1 }
                  if ($exitCode -ne 0 -and "$Env:failIfNotPassed" -eq 'yes') { exit $exitCode }
                  exit 0
            environmentVariables:
              - name: testSets
                type: String
                description: ALM test sets to run, separated by comma or semicolon (for example Root\Folder\TestSet1).
                value: <+input>
              - name: serverUrl
                type: String
                description: "URL of the ALM server (pattern: http(s)://<server>:<port>)."
                value: <+input>
              - name: ssoEnabled
                type: String
                description: Authenticate with an API key (SSO) instead of username and password (yes/no).
                value: <+input>.default(no).allowedValues(yes,no)
              - name: username
                type: String
                description: ALM username (used when SSO is no).
                value: <+input>.default(none)
              - name: password
                type: Secret
                description: Secret holding the ALM password (used when SSO is no).
                value: <+input>.default(none)
              - name: clientId
                type: String
                description: ALM API key client ID (used when SSO is yes).
                value: <+input>.default(none)
              - name: apiKeySecret
                type: Secret
                description: Secret holding the ALM API key secret (used when SSO is yes).
                value: <+input>.default(none)
              - name: domain
                type: String
                description: ALM domain that contains the test sets.
                value: <+input>
              - name: project
                type: String
                description: ALM project that contains the test sets.
                value: <+input>
              - name: timeout
                type: Number
                description: Maximum run time in seconds (-1 for no limit).
                value: <+input>.default(-1)
              - name: testSetsOrderByCriteria
                type: String
                description: Order in which the test sets are run, by id or by name.
                value: <+input>.default(name).allowedValues(id,name)
              - name: runMode
                type: String
                description: Where the tests run - LOCAL, REMOTE or PLANNED_HOST.
                value: <+input>.default(LOCAL).allowedValues(LOCAL,REMOTE,PLANNED_HOST)
              - name: runHost
                type: String
                description: Host that runs the tests when the run mode is REMOTE.
                value: <+input>.default(localhost)
              - name: generateJUnitReport
                type: String
                description: Also generate a JUnit XML report (yes/no).
                value: <+input>.default(no).allowedValues(yes,no)
              - name: failIfNotPassed
                type: String
                description: Fail the step when FTToolsLauncher returns a non-zero exit code (yes/no).
                value: <+input>.default(yes).allowedValues(yes,no)
            outputVariables: []
            delegateSelectors:
              - uft
          failureStrategies:
            - onFailure:
                errors:
                  - AllErrors
                action:
                  type: MarkAsFailure
          strategy:
            repeat:
              items: <+infra.hosts>
      - step:
          name: Upload Files
          identifier: Upload_Files
          type: ShellScript
          timeout: 10m
          when:
            stageStatus: All
          spec:
            shell: PowerShell
            onDelegate: false
            executionTarget:
              host: <+repeat.item>
              connectorRef: <+input>
            source:
              type: Inline
              spec:
                script: |
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Add-Type -AssemblyName System.Net.Http
                  $tools = "$env:FT_TOOLS_LAUNCHER"
                  if (-not $tools) { Write-Host "FT_TOOLS_LAUNCHER is not defined on this VM"; exit 1 }
                  if (Test-Path -LiteralPath $tools -PathType Leaf) { $tools = Split-Path -Parent $tools }
                  $pkg = "<+pipeline.identifier>"
                  $seqId = "<+pipeline.sequenceId>"
                  $work = Join-Path (Join-Path $tools $pkg) $seqId
                  New-Item -ItemType Directory -Force -Path $work | Out-Null
                  Set-Location $work
                  Write-Host "Work dir: $PWD"
                  $registry = "$env:RegistryName".Trim()
                  $key = "$env:ApiKey".Trim()
                  if ($registry -eq '') { Write-Host "No registry name provided"; exit 1 }
                  if ($key -eq '') { Write-Host "No API key provided"; exit 1 }
                  $names = @(Get-ChildItem -LiteralPath $PWD.Path -File | Select-Object -ExpandProperty Name)
                  $uri = "https://pkg.harness.io/pkg/<+account.identifier>/$registry/generic/$pkg/run-$seqId"
                  $link = "https://app.harness.io/ng/account/<+account.identifier>/module/har/orgs/<+org.identifier>/projects/<+project.identifier>/registries/$registry/artifacts/$pkg/versions/run-$seqId/overview"
                  $failed = $false
                  $client = $null
                  try {
                    $client = New-Object System.Net.Http.HttpClient
                    $client.DefaultRequestHeaders.Add("x-api-key", $key)
                    foreach ($f in $names) {
                      $path = Join-Path $PWD.Path $f
                      if (-not (Test-Path -LiteralPath $path)) {
                        Write-Host "Skipping $path (not found)"
                        continue
                      }
                      Write-Host "Uploading $path"
                      $stream = $null
                      $content = $null
                      $resp = $null
                      try {
                        # Stream the file from disk instead of loading it into memory.
                        $stream = [System.IO.File]::OpenRead($path)
                        $content = New-Object System.Net.Http.MultipartFormDataContent
                        $content.Add((New-Object System.Net.Http.StringContent($f)), 'filename')
                        $content.Add((New-Object System.Net.Http.StreamContent($stream)), 'file', $f)
                        $resp = $client.PutAsync($uri, $content).Result
                        Write-Host "HTTP $([int]$resp.StatusCode) $($resp.Content.ReadAsStringAsync().Result)"
                        if (-not $resp.IsSuccessStatusCode) { $failed = $true }
                      }
                      catch {
                        Write-Host "Upload failed for ${f}: $($_.Exception.GetBaseException().Message)"
                        $failed = $true
                      }
                      finally {
                        if ($null -ne $resp) { $resp.Dispose() }
                        if ($null -ne $content) { $content.Dispose() }
                        if ($null -ne $stream) { $stream.Dispose() }
                      }
                    }
                  }
                  finally {
                    if ($null -ne $client) { $client.Dispose() }
                  }
                  Write-Host ""
                  Write-Host "Uploaded files: $link"
                  if ($failed) { exit 1 }
                  if ("$env:cleanupTestRunFiles" -eq 'yes') {
                    Set-Location $tools
                    Remove-Item -LiteralPath $work -Recurse -Force
                    Write-Host "Deleted run folder: $work"
                  } else {
                    Write-Host "Run folder kept: $work"
                  }
            environmentVariables:
              - name: RegistryName
                type: String
                description: Name of the Harness Artifact Registry to upload the run files to.
                value: <+input>
              - name: ApiKey
                type: Secret
                description: Secret holding the Harness API key used to upload to the registry.
                value: <+input>
              - name: cleanupTestRunFiles
                type: String
                description: Delete the run folder on the VM after all uploads succeed (yes/no).
                value: <+input>.default(yes).allowedValues(yes,no)
            outputVariables: []
            delegateSelectors:
              - uft
          strategy:
            repeat:
              items: <+infra.hosts>
