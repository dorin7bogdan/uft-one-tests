template:
  name: ALM_RunAndUpload
  identifier: ALM_RunAndUpload
  versionLabel: "27.1"
  type: StepGroup
  description: Runs FTToolsLauncher against ALM with ALM_Run, then uploads all files from the run folder with FT_Harness_Upload, even if the run fails. FT_Harness_Upload deletes the run folder when cleanupTestRunFiles is yes and all uploads succeed.
  projectIdentifier: UFT
  orgIdentifier: opentext
  tags:
    functional_testing: ""
  spec:
    stageType: CD
    steps:
      - step:
          name: Run FTToolsLauncher
          identifier: Run_FTToolsLauncher
          template:
            templateRef: ALM_Run
            versionLabel: "27.1"
            templateInputs:
              identifier: Run_FTToolsLauncher
              type: ShellScript
              spec:
                executionTarget:
                  connectorRef: <+input>
                environmentVariables:
                  - name: testSets
                    type: String
                    value: <+input>
                  - name: serverUrl
                    type: String
                    value: <+input>
                  - name: ssoEnabled
                    type: String
                    value: <+input>.default(no).allowedValues(yes,no)
                  - name: username
                    type: String
                    value: <+input>.default(empty)
                  - name: password
                    type: Secret
                    value: <+input>.default(empty)
                  - name: clientId
                    type: String
                    value: <+input>.default(empty)
                  - name: apiKeySecret
                    type: Secret
                    value: <+input>.default(empty)
                  - name: domain
                    type: String
                    value: <+input>
                  - name: project
                    type: String
                    value: <+input>
                  - name: timeout
                    type: Number
                    value: <+input>.default(-1)
                  - name: testSetsOrderByCriteria
                    type: String
                    value: <+input>.default(name).allowedValues(id,name)
                  - name: runMode
                    type: String
                    value: <+input>.default(LOCAL).allowedValues(LOCAL,REMOTE,PLANNED_HOST)
                  - name: runHost
                    type: String
                    value: <+input>.default(localhost)
                  - name: generateJUnitReport
                    type: String
                    value: <+input>.default(no).allowedValues(yes,no)
                  - name: failIfNotPassed
                    type: String
                    value: <+input>.default(yes).allowedValues(yes,no)
      - step:
          name: Upload Files
          identifier: Upload_Files
          when:
            stageStatus: All
          template:
            templateRef: FT_Harness_Upload
            versionLabel: "27.1"
            templateInputs:
              identifier: Upload_Files
              type: ShellScript
              spec:
                executionTarget:
                  connectorRef: <+input>
                environmentVariables:
                  - name: RegistryName
                    type: String
                    value: <+input>
                  - name: ApiKey
                    type: Secret
                    value: <+input>
                  - name: cleanupTestRunFiles
                    type: String
                    value: <+input>.default(yes).allowedValues(yes,no)
          strategy:
            repeat:
              items: <+infra.hosts>
