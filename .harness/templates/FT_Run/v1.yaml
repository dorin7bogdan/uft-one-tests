template:
  name: FT_Run
  identifier: FT_Run
  versionLabel: v1
  type: Step
  description: Copy of Run FTToolsLauncher. WinRM Command step that writes props.txt (runType=FileSystem, resultsFilename=results.xml, testPath with doubled backslashes, integer timeout, fsZipTestReports=true, generateJUnitReport yes/no from input) in FT_TOOLS_LAUNCHER\<pipeline identifier>\<sequenceId> on the VM, prints the launcher command, and runs FTToolsLauncher, waiting for the process to complete. Fails the step on a non-zero exit code when failIfNotPassed is yes.
  projectIdentifier: UFT
  orgIdentifier: default
  tags:
    ai_generated: ""
  spec:
    name: Run FTToolsLauncher
    identifier: Run_FTToolsLauncher
    timeout: 10m
    type: Command
    spec:
      onDelegate: false
      environmentVariables:
        - name: testPaths
          type: String
          value: <+input>
        - name: timeout
          type: Number
          value: <+input>
        - name: cancelRunOnFailure
          type: String
          value: <+input>.default(no).allowedValues(yes,no)
        - name: resultTestNameOnly
          type: String
          value: <+input>.default(yes).allowedValues(yes,no)
        - name: resultUnifiedTestClassname
          type: String
          value: <+input>.default(no).allowedValues(yes,no)
        - name: cleanupTestRunFiles
          type: String
          value: <+input>.default(yes).allowedValues(yes,no)
        - name: failIfNotPassed
          type: String
          value: <+input>.default(yes).allowedValues(yes,no)
        - name: generateJUnitReport
          type: String
          value: <+input>.default(no).allowedValues(yes,no)
      commandUnits:
        - identifier: Run_FTToolsLauncher
          name: Run FTToolsLauncher
          type: Script
          spec:
            shell: PowerShell
            source:
              type: Inline
              spec:
                script: |-
                  $ErrorActionPreference = 'Stop'
                  $tools = "$Env:FT_TOOLS_LAUNCHER"
                  if (-not $tools) { Write-Host "FT_TOOLS_LAUNCHER is not defined on this VM"; exit 1 }
                  if (Test-Path -LiteralPath $tools -PathType Leaf) {
                    $exe = $tools
                    $dir = Split-Path -Parent $tools
                  } else {
                    $dir = $tools
                    $exe = Get-ChildItem -Path $dir -Filter 'FTToolsLauncher*.exe' | Select-Object -First 1 -ExpandProperty FullName
                  }
                  if (-not $exe) { Write-Host "FTToolsLauncher not found in $tools"; exit 1 }
                  $work = Join-Path (Join-Path $dir "<+pipeline.identifier>") "<+pipeline.sequenceId>"
                  New-Item -ItemType Directory -Force -Path $work | Out-Null
                  Set-Location $work
                  Write-Host "Work dir: $PWD"
                  $f = "props.txt"
                  $tp = "$Env:testPaths" -replace '\\+', '\\'
                  $to = [int][math]::Truncate([double]::Parse("$Env:timeout", [Globalization.CultureInfo]::InvariantCulture))
                  $lines = @(
                    "runType=FileSystem",
                    "Test1=$tp",
                    "resultsFilename=results.xml",
                    "timeout=$to",
                    "cancelRunOnFailure=$Env:cancelRunOnFailure",
                    "resultTestNameOnly=$Env:resultTestNameOnly",
                    "resultUnifiedTestClassname=$Env:resultUnifiedTestClassname",
                    "cleanupTestRunFiles=$Env:cleanupTestRunFiles",
                    "fsZipTestReports=true",
                    "generateJUnitReport=$Env:generateJUnitReport"
                  )
                  [IO.File]::WriteAllLines("$PWD\$f", $lines)
                  Write-Host "$exe -paramfile $f"
                  $p = Start-Process $exe -ArgumentList "-paramfile", $f -Wait -PassThru -NoNewWindow
                  Write-Host "FTToolsLauncher exit code: $($p.ExitCode)"
                  if ($p.ExitCode -ne 0 -and "$Env:failIfNotPassed" -eq 'yes') { exit $p.ExitCode }
                  exit 0
      delegateSelectors:
        - uft
    failureStrategies:
      - onFailure:
          errors:
            - AllErrors
          action:
            type: MarkAsFailure
    strategy:
      repeat:
        items: <+infra.hosts>
