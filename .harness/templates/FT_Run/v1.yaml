template:
  name: FT_Run
  identifier: FT_Run
  versionLabel: v1
  type: Step
  description: Copy of Run FTToolsLauncher. WinRM Command step that writes props_<seqId>.txt (including resultsFilename=results_<seqId>.xml, testPath with doubled backslashes) from its inputs and runs FTToolsLauncher with it, waiting for the process to complete.
  projectIdentifier: UFT
  orgIdentifier: default
  tags:
    ai_generated: ""
  spec:
    name: Run FTToolsLauncher
    identifier: Run_FTToolsLauncher
    timeout: 10m
    type: Command
    spec:
      onDelegate: false
      environmentVariables:
        - name: FT_RUN_TYPE
          type: String
          value: <+input>
        - name: FT_TEST_PATH
          type: String
          value: <+input>
        - name: FT_WORK_DIR
          type: String
          value: <+input>
      commandUnits:
        - identifier: Run_FTToolsLauncher
          name: Run FTToolsLauncher
          type: Script
          spec:
            workingDirectory: C:\Temp\FT
            shell: PowerShell
            source:
              type: Inline
              spec:
                script: |-
                  $ErrorActionPreference = 'Stop'
                  Set-Location "$Env:FT_WORK_DIR"
                  Write-Host "Work dir: $PWD"
                  $f = "props_<+pipeline.sequenceId>.txt"
                  $tp = "$Env:FT_TEST_PATH" -replace '\\+', '\\'
                  [IO.File]::WriteAllLines("$PWD\$f", @("runType=$Env:FT_RUN_TYPE", "Test1=$tp", "resultsFilename=results_<+pipeline.sequenceId>.xml"))
                  $exe = Get-ChildItem -Path $PWD -Filter 'FTToolsLauncher*.exe' | Select-Object -First 1 -ExpandProperty FullName
                  if (-not $exe) { $exe = (Get-Command FTToolsLauncher -ErrorAction SilentlyContinue).Source }
                  if (-not $exe) { Write-Host "FTToolsLauncher not found in $PWD or on PATH"; exit 1 }
                  Write-Host "Launcher: $exe"
                  $p = Start-Process $exe -ArgumentList "-paramfile", $f -Wait -PassThru -NoNewWindow
                  exit $p.ExitCode
      delegateSelectors:
        - uft
    failureStrategies:
      - onFailure:
          errors:
            - AllErrors
          action:
            type: MarkAsFailure
    strategy:
      repeat:
        items: <+infra.hosts>
