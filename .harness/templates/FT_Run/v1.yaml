template:
  name: FT_Run
  identifier: FT_Run
  versionLabel: v1
  type: Step
  description: Copy of Run FTToolsLauncher. WinRM Command step that writes props_<sequenceId>.txt (runType=FileSystem, resultsFilename=results_<sequenceId>.xml, testPath with doubled backslashes) in a per-pipeline subfolder of FT_TOOLS_LAUNCHER on the VM and runs FTToolsLauncher, waiting for the process to complete.
  projectIdentifier: UFT
  orgIdentifier: default
  tags:
    ai_generated: ""
  spec:
    name: Run FTToolsLauncher
    identifier: Run_FTToolsLauncher
    timeout: 10m
    type: Command
    spec:
      onDelegate: false
      environmentVariables:
        - name: testPaths
          type: String
          value: <+input>
        - name: timeout
          type: Number
          value: <+input>
        - name: cancelRunOnFailure
          type: String
          value: <+input>.default(false).allowedValues(true,false)
        - name: resultTestNameOnly
          type: String
          value: <+input>.default(true).allowedValues(true,false)
        - name: resultUnifiedTestClassname
          type: String
          value: <+input>.default(false).allowedValues(true,false)
        - name: archiveReportsAsSingleArtifact
          type: String
          value: <+input>.default(false).allowedValues(true,false)
        - name: cleanupTestRunFiles
          type: String
          value: <+input>.default(true).allowedValues(true,false)
        - name: failIfNotPassed
          type: String
          value: <+input>.default(true).allowedValues(true,false)
      commandUnits:
        - identifier: Run_FTToolsLauncher
          name: Run FTToolsLauncher
          type: Script
          spec:
            shell: PowerShell
            source:
              type: Inline
              spec:
                script: |-
                  $ErrorActionPreference = 'Stop'
                  $tools = "$Env:FT_TOOLS_LAUNCHER"
                  if (-not $tools) { Write-Host "FT_TOOLS_LAUNCHER is not defined on this VM"; exit 1 }
                  if (Test-Path -LiteralPath $tools -PathType Leaf) {
                    $exe = $tools
                    $dir = Split-Path -Parent $tools
                  } else {
                    $dir = $tools
                    $exe = Get-ChildItem -Path $dir -Filter 'FTToolsLauncher*.exe' | Select-Object -First 1 -ExpandProperty FullName
                  }
                  if (-not $exe) { Write-Host "FTToolsLauncher not found in $tools"; exit 1 }
                  $work = Join-Path $dir "<+pipeline.identifier>"
                  New-Item -ItemType Directory -Force -Path $work | Out-Null
                  Set-Location $work
                  Write-Host "Work dir: $PWD"
                  $f = "props_<+pipeline.sequenceId>.txt"
                  $tp = "$Env:testPaths" -replace '\\+', '\\'
                  $lines = @(
                    "runType=FileSystem",
                    "Test1=$tp",
                    "resultsFilename=results_<+pipeline.sequenceId>.xml",
                    "timeout=$Env:timeout",
                    "cancelRunOnFailure=$Env:cancelRunOnFailure",
                    "resultTestNameOnly=$Env:resultTestNameOnly",
                    "resultUnifiedTestClassname=$Env:resultUnifiedTestClassname",
                    "archiveReportsAsSingleArtifact=$Env:archiveReportsAsSingleArtifact",
                    "cleanupTestRunFiles=$Env:cleanupTestRunFiles",
                    "failIfNotPassed=$Env:failIfNotPassed"
                  )
                  [IO.File]::WriteAllLines("$PWD\$f", $lines)
                  Write-Host "Launcher: $exe"
                  $p = Start-Process $exe -ArgumentList "-paramfile", $f -Wait -PassThru -NoNewWindow
                  exit $p.ExitCode
      delegateSelectors:
        - uft
    failureStrategies:
      - onFailure:
          errors:
            - AllErrors
          action:
            type: MarkAsFailure
    strategy:
      repeat:
        items: <+infra.hosts>
