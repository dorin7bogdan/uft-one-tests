template:
  name: FT_RunAndUpload
  identifier: FT_RunAndUpload
  versionLabel: v1
  type: StepGroup
  description: Copy of FT_Run_And_Upload. Runs FTToolsLauncher with FT_Run, then uploads all files from the run folder with FT_Upload, even if the run fails. FT_Upload deletes the run folder when cleanupTestRunFiles is yes and all uploads succeed.
  projectIdentifier: UFT
  orgIdentifier: default
  tags:
    ai_generated: ""
  spec:
    stageType: CD
    steps:
      - step:
          name: Run FTToolsLauncher
          identifier: Run_FTToolsLauncher
          template:
            templateRef: FT_Run
            versionLabel: v1
            templateInputs:
              identifier: Run_FTToolsLauncher
              type: Command
              spec:
                environmentVariables:
                  - name: testPaths
                    type: String
                    value: <+input>
                  - name: timeout
                    type: Number
                    value: <+input>
                  - name: cancelRunOnFailure
                    type: String
                    value: <+input>.default(no).allowedValues(yes,no)
                  - name: resultTestNameOnly
                    type: String
                    value: <+input>.default(yes).allowedValues(yes,no)
                  - name: resultUnifiedTestClassname
                    type: String
                    value: <+input>.default(no).allowedValues(yes,no)
                  - name: failIfNotPassed
                    type: String
                    value: <+input>.default(yes).allowedValues(yes,no)
                  - name: generateJUnitReport
                    type: String
                    value: <+input>.default(no).allowedValues(yes,no)
      - step:
          name: Upload Files
          identifier: Upload_Files
          when:
            stageStatus: All
          template:
            templateRef: FT_Upload
            versionLabel: v1
            templateInputs:
              identifier: Upload_Files
              type: Command
              spec:
                environmentVariables:
                  - name: RegistryName
                    type: String
                    value: <+input>
                  - name: ApiKey
                    type: String
                    value: <+input>
                  - name: cleanupTestRunFiles
                    type: String
                    value: <+input>.default(yes).allowedValues(yes,no)
          strategy:
            repeat:
              items: <+infra.hosts>
