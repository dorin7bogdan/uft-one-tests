pipeline:
  name: UFT Run Upload GitHub StepGroup
  identifier: UFT_Run_Upload_GitHub_StepGroup
  description: Runs FTToolsLauncher on the UFT VM through WinRM and uploads the run folder to an Artifact Registry, using the GitHub-stored FT_RunAndUpload step group template.
  projectIdentifier: UFT
  orgIdentifier: default
  tags:
    ai_generated: ""
  variables:
    - name: registryName
      type: String
      value: <+input>.default(uft-one)
  stages:
    - stage:
        name: WinRM Stage
        identifier: WinRM_Stage
        type: Deployment
        spec:
          deploymentType: WinRm
          service:
            serviceRef: ftservice
          environment:
            environmentRef: ftwindows
            deployToAll: false
            infrastructureDefinitions: <+input>
          execution:
            steps:
              - stepGroup:
                  name: FT Run and Upload
                  identifier: FT_RunAndUpload
                  template:
                    templateRef: FT_RunAndUpload
                    versionLabel: "27.1"
                    templateInputs:
                      steps:
                        - step:
                            identifier: Run_FTToolsLauncher
                            template:
                              templateInputs:
                                identifier: Run_FTToolsLauncher
                                type: ShellScript
                                spec:
                                  executionTarget:
                                    connectorRef: <+input>
                                  environmentVariables:
                                    - name: testPath
                                      type: String
                                      value: <+input>.default(C:\UFTTests\QuickPass)
                                    - name: timeout
                                      type: Number
                                      value: <+input>.default(-1)
                                    - name: cancelRunOnFailure
                                      type: String
                                      value: <+input>.default(no).allowedValues(yes,no)
                                    - name: resultTestNameOnly
                                      type: String
                                      value: <+input>.default(yes).allowedValues(yes,no)
                                    - name: resultUnifiedTestClassname
                                      type: String
                                      value: <+input>.default(no).allowedValues(yes,no)
                                    - name: failIfNotPassed
                                      type: String
                                      value: <+input>.default(yes).allowedValues(yes,no)
                                    - name: generateJUnitReport
                                      type: String
                                      value: <+input>.default(no).allowedValues(yes,no)
                                    - name: deletePreviousTestReports
                                      type: String
                                      value: <+input>.default(yes).allowedValues(yes,no)
                        - step:
                            identifier: Upload_Files
                            template:
                              templateInputs:
                                identifier: Upload_Files
                                type: ShellScript
                                spec:
                                  executionTarget:
                                    connectorRef: <+input>
                                  environmentVariables:
                                    - name: RegistryName
                                      type: String
                                      value: <+pipeline.variables.registryName>
                                    - name: ApiKey
                                      type: Secret
                                      value: <+input>
                                    - name: cleanupTestRunFiles
                                      type: String
                                      value: <+input>.default(yes).allowedValues(yes,no)
            rollbackSteps: []
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
