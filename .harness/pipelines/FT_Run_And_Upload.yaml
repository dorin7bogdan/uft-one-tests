pipeline:
  name: FT Run And Upload
  identifier: FT_Run_And_Upload
  description: Runs functional tests with FTToolsLauncher on WinRM hosts and uploads the results to an Artifact Registry.
  projectIdentifier: UFT
  orgIdentifier: default
  tags:
    ai_generated: ""
  stages:
    - stage:
        name: Run Functional Tests
        identifier: Run_Functional_Tests
        description: Deploys to the WinRM infrastructure using the FT_RunAndUpload_Inline step group template.
        type: Deployment
        spec:
          deploymentType: WinRm
          service:
            serviceRef: ftservice
          environment:
            environmentRef: ftwindows
            deployToAll: false
            infrastructureDefinitions:
              - identifier: winrmdorinvm2infrastructure
          execution:
            steps:
              - stepGroup:
                  name: FT Run And Upload
                  identifier: FT_Run_And_Upload
                  template:
                    templateRef: FT_RunAndUpload_Inline
                    versionLabel: "27.1"
                    templateInputs:
                      steps:
                        - step:
                            identifier: Run_FTToolsLauncher
                            type: ShellScript
                            spec:
                              executionTarget:
                                connectorRef: <+input>
                              environmentVariables:
                                - name: testPath
                                  type: String
                                  value: <+input>
                                - name: timeout
                                  type: Number
                                  value: <+input>.default(-1)
                                - name: cancelRunOnFailure
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: resultTestNameOnly
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
                                - name: resultUnifiedTestClassname
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: failIfNotPassed
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
                                - name: generateJUnitReport
                                  type: String
                                  value: <+input>.default(no).allowedValues(yes,no)
                                - name: deletePreviousTestReports
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
                        - step:
                            identifier: Upload_Files
                            type: ShellScript
                            spec:
                              executionTarget:
                                connectorRef: <+input>
                              environmentVariables:
                                - name: RegistryName
                                  type: String
                                  value: <+input>
                                - name: ApiKey
                                  type: Secret
                                  value: <+input>
                                - name: cleanupTestRunFiles
                                  type: String
                                  value: <+input>.default(yes).allowedValues(yes,no)
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
